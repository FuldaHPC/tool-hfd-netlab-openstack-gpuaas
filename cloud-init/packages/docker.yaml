# Docker with the NVIDIA container toolkit, so containers get the GPU with "--gpus all".
# The ubuntu user may use docker without sudo.
gpuaas:
  title: Docker with NVIDIA container toolkit
  group: Containers
  order: 30
  disk: 1
  os:
    ubuntu-26.04: tested
    ubuntu-24.04: tested
packages:
  - docker.io
runcmd:
  - curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor --yes -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  - curl -fsSL https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#' > /etc/apt/sources.list.d/nvidia-container-toolkit.list
  - apt-get -o DPkg::Lock::Timeout=600 update
  - DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=600 install -y nvidia-container-toolkit
  - nvidia-ctk runtime configure --runtime=docker
  - systemctl restart docker
  - usermod -aG docker ubuntu
